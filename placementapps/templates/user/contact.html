{% extends "user/user_index.html" %}
{% load static %}

{% block content %}

<style>
    /* ===== Contact Page ===== */
    .contact-wrapper {
        padding: 4rem 0;
        background: var(--bg-primary);
        min-height: 70vh;
    }

    .contact-header {
        max-width: 900px;
        margin: 0 auto 3rem;
        padding: 0 1rem;
        text-align: center;
    }

    .contact-header h1 {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: var(--text-primary);
        font-size: 2.5rem;
        letter-spacing: -0.8px;
        margin-bottom: 0.5rem;
    }

    .contact-header .subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0;
    }

    .contact-header .gold-bar {
        width: 60px;
        height: 4px;
        background: var(--color-gold);
        border-radius: 2px;
        margin: 1rem auto 0;
    }

    /* ===== Two-column layout ===== */
    .contact-grid {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: stretch;
    }

    /* ===== Map panel ===== */
    .map-panel {
        background: var(--bg-secondary);
        border: 2px solid var(--border-light);
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        position: relative;
        min-height: 480px;
        display: flex;
        flex-direction: column;
    }

    .map-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--color-navy), var(--color-gold));
        z-index: 2;
    }

    .map-panel iframe {
        border: 0;
        width: 100%;
        height: 100%;
        min-height: 480px;
        flex: 1;
        display: block;
        filter: contrast(1.05) saturate(1.05);
    }

    [data-theme="dark"] .map-panel iframe {
        filter: invert(0.92) hue-rotate(180deg) contrast(1.05) saturate(0.85);
    }

    /* ===== Form panel ===== */
    .form-panel {
        background: var(--bg-secondary);
        border: 2px solid var(--border-light);
        border-radius: 0.75rem;
        padding: 2rem;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
    }

    .form-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--color-navy), var(--color-gold));
        z-index: 2;
    }

    .form-panel h3 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--text-primary);
        font-size: 1.35rem;
        letter-spacing: -0.3px;
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 2px solid var(--border-light);
        position: relative;
    }

    .form-panel h3::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 40px;
        height: 2px;
        background: var(--color-gold);
    }

    /* ===== Form fields ===== */
    .form-panel .form-label {
        font-family: 'Inter', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 0.35rem;
        display: block;
        position: relative;
        z-index: 1;
    }

    .form-panel .form-control {
        font-family: 'Inter', sans-serif;
        font-size: 0.92rem;
        padding: 0.75rem 1rem;
        border: 2px solid var(--border-light);
        border-radius: 0.5rem;
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: border-color 0.3s, box-shadow 0.3s;
        position: relative;
        z-index: 1;
        width: 100%;
    }

    .form-panel .form-control:focus {
        border-color: var(--color-gold);
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        outline: none;
        background: var(--bg-primary);
        color: var(--text-primary);
    }

    .form-panel .form-control::placeholder {
        color: var(--text-tertiary);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 140px;
    }

    /* ===== Submit button ===== */
    .btn-send {
        width: 100%;
        height: 52px;
        padding: 0 1.5rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: var(--color-navy);
        background: var(--color-gold);
        border: 2px solid var(--color-gold);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        position: relative;
        z-index: 1;
    }

    .btn-send:hover {
        background: var(--color-gold-light);
        border-color: var(--color-gold-light);
        color: var(--color-navy);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 158, 11, 0.25);
    }

    /* ===== Quick info cards (optional footer) ===== */
    .quick-info {
        max-width: 1200px;
        margin: 3rem auto 0;
        padding: 0 1rem;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
    }

    .quick-info-card {
        background: var(--bg-secondary);
        border: 2px solid var(--border-light);
        border-radius: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        transition: all 0.3s ease;
    }

    .quick-info-card:hover {
        border-color: var(--color-gold);
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    .quick-info-card i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        background: linear-gradient(135deg, var(--color-navy), var(--color-navy-light));
        color: var(--color-gold);
        border-radius: 0.5rem;
        font-size: 1.1rem;
        margin-bottom: 0.75rem;
    }

    .quick-info-card h6 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--text-primary);
        font-size: 0.95rem;
        margin-bottom: 0.35rem;
    }

    .quick-info-card p {
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0;
        line-height: 1.5;
    }

    .quick-info-card p a {
        color: var(--color-gold);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }
    .quick-info-card p a:hover {
        color: var(--color-gold-light);
        text-decoration: underline;
    }

    /* ===== Responsive ===== */
    @media (max-width: 991px) {
        .contact-wrapper { padding: 3rem 0; }
        .contact-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        .map-panel,
        .map-panel iframe { min-height: 350px; }
        .quick-info {
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-top: 2rem;
        }
    }

    @media (max-width: 576px) {
        .contact-header h1 { font-size: 1.85rem; }
        .form-panel { padding: 1.5rem 1.25rem; }
    }
</style>


<!-- ===== Contact Section ===== -->
<section class="contact-wrapper">

    <!-- Header -->
    <div class="contact-header">
        <h1>Contact Us</h1>
        <p class="subtitle">Have a question? We'd love to hear from you.</p>
        <div class="gold-bar"></div>
    </div>

    <!-- Map + Form -->
    <div class="contact-grid">

        <!-- Map -->
        <div class="map-panel">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3001156.4288297426!2d-78.01371936852176!3d42.72876761954724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4ccc4bf0f123a5a9%3A0xddcfc6c1de189567!2sNew%20York%2C%20USA!5e0!3m2!1sen!2sbd!4v1603794290143!5m2!1sen!2sbd"
                frameborder="0"
                allowfullscreen=""
                aria-hidden="false"
                tabindex="0"
                loading="lazy">
            </iframe>
        </div>

        <!-- Form -->
        <div class="form-panel">
            <h3>Send Us a Message</h3>
            <form>
                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name"
                               placeholder="e.g., John Doe" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Your Email</label>
                        <input type="email" class="form-control" id="email"
                               placeholder="e.g., you@example.com" required>
                    </div>

                    <div class="col-12">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject"
                               placeholder="What is this regarding?" required>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="5"
                                  placeholder="Type your message here..." required></textarea>
                    </div>

                    <div class="col-12">
                        <button class="btn-send" type="submit">
                            <i class="bi bi-send"></i> Send Message
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </div>

    <!-- Quick info cards -->
    <div class="quick-info">

        <div class="quick-info-card">
            <i class="bi bi-geo-alt-fill"></i>
            <h6>Address</h6>
            <p>Mannuthy, Thrissur<br>Kerala, India</p>
        </div>

        <div class="quick-info-card">
            <i class="bi bi-telephone-fill"></i>
            <h6>Phone</h6>
            <p><a href="tel:+919876543210">+91 98765 43210</a></p>
        </div>

        <div class="quick-info-card">
            <i class="bi bi-envelope-fill"></i>
            <h6>Email</h6>
            <p><a href="mailto:afsasiddique@gmail.com">afsasiddique@gmail.com</a></p>
        </div>

    </div>

</section>

{% endblock %}
