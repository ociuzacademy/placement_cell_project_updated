{% extends "admin/admin_index.html" %}
{% load static %}

{% block content %}

<style>
    /* ===== Departments Page ===== */
    .dept-wrapper {
        padding: 3.5rem 0;
        background: var(--bg-primary);
        min-height: 70vh;
    }

    .dept-header {
        max-width: 1200px;
        margin: 0 auto 2.5rem;
        padding: 0 1rem;
        text-align: center;
    }

    .dept-header h1 {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: var(--text-primary);
        font-size: 2.5rem;
        letter-spacing: -0.8px;
        margin-bottom: 0.5rem;
    }

    .dept-header .subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0;
    }

    .dept-header .gold-bar {
        width: 60px;
        height: 4px;
        background: var(--color-gold);
        border-radius: 2px;
        margin: 1rem auto 0;
    }

    /* ===== Department card ===== */
    .cat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-secondary) !important;
        border: 2px solid var(--border-light) !important;
        border-radius: 0.75rem !important;
        padding: 2.25rem 1.5rem !important;
        text-align: center;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        height: 100%;
        min-height: 180px;
    }

    .cat-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--color-navy), var(--color-gold));
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .cat-item::after {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    .cat-item i {
        color: var(--color-gold) !important;
        font-size: 2.75rem !important;
        margin-bottom: 1.25rem;
        display: inline-block;
        transition: transform 0.3s ease;
        position: relative;
        z-index: 1;
    }

    .cat-item h6 {
        font-family: 'Playfair Display', serif;
        color: var(--text-primary) !important;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0;
        position: relative;
        z-index: 1;
        line-height: 1.3;
    }

    .cat-item:hover {
        border-color: var(--color-gold) !important;
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
    }

    .cat-item:hover::before {
        opacity: 1;
    }

    .cat-item:hover i {
        transform: scale(1.15);
    }

    /* Empty state */
    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 4rem 1rem;
        background: var(--bg-secondary);
        border: 2px dashed var(--border-light);
        border-radius: 0.75rem;
    }

    .empty-state i {
        font-size: 3.5rem;
        color: var(--color-gold);
        opacity: 0.6;
        margin-bottom: 1rem;
        display: block;
    }

    .empty-state h5 {
        font-family: 'Playfair Display', serif;
        color: var(--text-primary);
        font-weight: 700;
        margin-bottom: 0.35rem;
    }

    .empty-state p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .dept-header h1 { font-size: 1.85rem; }
        .cat-item { padding: 1.75rem 1rem !important; min-height: 150px; }
        .cat-item i { font-size: 2.25rem !important; }
        .cat-item h6 { font-size: 1rem; }
    }
</style>


<!-- ===== Departments Section ===== -->
<section class="dept-wrapper">

    <!-- Header -->
    <div class="dept-header">
        <h1>Departments</h1>
        <p class="subtitle">Select a department to view its courses and programs</p>
        <div class="gold-bar"></div>
    </div>

    <!-- Department cards -->
    <div class="container-lg">
        <div class="row g-4">

            {% for department in departments %}
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <a class="cat-item" href="{% url 'courses_listing' department.id %}">
                        <i class="fa fa-3x {{ department.icon }}"></i>
                        <h6>{{ department.name }}</h6>
                    </a>
                </div>
            {% empty %}
                <div class="empty-state">
                    <i class="bi bi-folder-x"></i>
                    <h5>No Departments Found</h5>
                    <p>Add a department to get started.</p>
                </div>
            {% endfor %}

        </div>
    </div>

</section>

{% endblock %}
