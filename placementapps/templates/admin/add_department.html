{% extends "admin/admin_index.html" %}
{% load static %}

{% block content %}

<style>
    /* ===== Add Department Page ===== */
    .add-dept-wrapper {
        padding: 4rem 0;
        background: var(--bg-primary);
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form-container {
        width: 100%;
        max-width: 460px;
        padding: 2.5rem;
        border-radius: 0.75rem;
        background: var(--bg-secondary);
        box-shadow: var(--shadow-lg);
        border-top: 5px solid var(--color-navy);
        position: relative;
        overflow: hidden;
    }

    .form-container::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    .form-container h2 {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: var(--text-primary);
        font-size: 1.75rem;
        letter-spacing: -0.5px;
        margin-bottom: 1.75rem;
        text-align: center;
        position: relative;
        z-index: 1;
    }

    .form-container .form-label {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.4rem;
    }

    .form-container .form-control {
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        padding: 0.75rem 1rem;
        border: 2px solid var(--border-light);
        border-radius: 0.5rem;
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: border-color 0.3s, box-shadow 0.3s;
        position: relative;
        z-index: 1;
    }

    .form-container .form-control:focus {
        border-color: var(--color-gold);
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        outline: none;
        background: var(--bg-primary);
        color: var(--text-primary);
    }

    .form-container .form-control::placeholder {
        color: var(--text-tertiary);
    }

    /* ===== Button group (stacked) ===== */
    .button-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.75rem;
        position: relative;
        z-index: 1;
    }

    .button-group .btn {
        width: 100%;
        height: 50px;
        padding: 0 1rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: 2px solid transparent;
        text-decoration: none;
    }

    /* Add Department = gold (primary) */
    .btn-add {
        background: var(--color-gold);
        color: var(--color-navy);
        border-color: var(--color-gold);
    }
    .btn-add:hover {
        background: var(--color-gold-light);
        border-color: var(--color-gold-light);
        color: var(--color-navy);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 158, 11, 0.25);
    }

    /* View Departments = navy outline */
    .btn-view {
        background: transparent;
        color: var(--color-navy);
        border-color: var(--color-navy);
    }
    [data-theme="dark"] .btn-view {
        color: var(--color-gold);
        border-color: var(--color-gold);
    }
    .btn-view:hover {
        background: var(--color-navy);
        color: #fff;
        border-color: var(--color-navy);
        transform: translateY(-2px);
    }
    [data-theme="dark"] .btn-view:hover {
        background: var(--color-gold);
        color: var(--color-navy);
        border-color: var(--color-gold);
    }

    /* Back = muted outline */
    .btn-back {
        background: transparent;
        color: var(--text-secondary);
        border-color: var(--border-normal);
    }
    .btn-back:hover {
        background: var(--text-secondary);
        color: #fff;
        border-color: var(--text-secondary);
        transform: translateY(-2px);
    }

    /* ===== Modal ===== */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        z-index: 1050;
    }
    .modal.show { display: flex; }

    .modal-content {
        background-color: var(--bg-secondary);
        padding: 2rem 1.75rem;
        border-radius: 0.75rem;
        box-shadow: var(--shadow-xl);
        border-top: 5px solid var(--color-navy);
        text-align: center;
        width: 90%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .modal-content::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    .modal-content p {
        color: var(--text-primary);
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

    .modal-actions {
        display: flex;
        gap: 0.75rem;
        width: 100%;
        position: relative;
        z-index: 1;
    }

    .modal-actions .btn {
        flex: 1;
        height: 44px;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.3px;
    }

    /* Okay = gold */
    .modal-actions .btn-success {
        background: var(--color-gold);
        color: var(--color-navy);
        border-color: var(--color-gold);
    }
    .modal-actions .btn-success:hover {
        background: var(--color-gold-light);
        border-color: var(--color-gold-light);
        color: var(--color-navy);
        transform: translateY(-2px);
    }

    /* Cancel = muted outline */
    .modal-actions .btn-danger {
        background: transparent;
        color: var(--text-secondary);
        border-color: var(--border-normal);
    }
    .modal-actions .btn-danger:hover {
        background: var(--text-secondary);
        color: #fff;
        border-color: var(--text-secondary);
        transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 576px) {
        .form-container {
            padding: 1.75rem 1.25rem;
        }
        .form-container h2 {
            font-size: 1.4rem;
        }
    }
</style>


<!-- ===== Add Department Section ===== -->
<section class="add-dept-wrapper">
    <div class="form-container">
        <h2>Add Department</h2>

        <form method="post" id="departmentForm">
            {% csrf_token %}

            <div class="mb-3 position-relative" style="z-index: 1;">
                <label for="name" class="form-label">Department Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="e.g., Computer Science" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-add">
                    <i class="bi bi-plus-circle"></i> Add Department
                </button>
                <a href="/list_department/" class="btn btn-view">
                    <i class="bi bi-list-ul"></i> View Departments
                </a>
                <a href="javascript:history.go(-1);" class="btn btn-back">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </form>
    </div>
</section>


<!-- ===== Modal Popup ===== -->
<div id="successModal" class="modal">
    <div class="modal-content">
        <p>Department added successfully!</p>
        <div class="modal-actions">
            <button id="okButton" class="btn btn-success">Okay</button>
            <button id="cancelButton" class="btn btn-danger">Cancel</button>
        </div>
    </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('departmentForm');
        const successModal = document.getElementById('successModal');
        const okButton = document.getElementById('okButton');
        const cancelButton = document.getElementById('cancelButton');

        // Intercept form submission — show modal first
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            successModal.classList.add('show');
        });

        // "Okay" — close modal and submit for real
        okButton.addEventListener('click', function () {
            successModal.classList.remove('show');
            form.submit();
        });

        // "Cancel" — close modal without submitting
        cancelButton.addEventListener('click', function () {
            successModal.classList.remove('show');
        });

        // Close modal if user clicks the dark backdrop
        successModal.addEventListener('click', function (e) {
            if (e.target === successModal) {
                successModal.classList.remove('show');
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && successModal.classList.contains('show')) {
                successModal.classList.remove('show');
            }
        });
    });
</script>

{% endblock %}
